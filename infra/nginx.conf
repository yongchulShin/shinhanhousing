# /etc/nginx/sites-available/shinhan-api
# 심볼릭 링크: sudo ln -s /etc/nginx/sites-available/shinhan-api /etc/nginx/sites-enabled/

upstream shinhan_api {
    server 127.0.0.1:3000 keepalive 32;
    keepalive_requests 1000;
}

# HTTP API origin. CloudFront forwards /api/* here over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    client_max_body_size 10M;
    access_log /var/log/nginx/shinhan-api-access.log;
    error_log  /var/log/nginx/shinhan-api-error.log warn;

    location /health {
        proxy_pass http://shinhan_api/api/health;
        access_log off;
    }

    location /api/ {
        proxy_pass http://shinhan_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location / { return 404; }
}

# HTTPS API 서버
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.shinhanhousing.co.kr;

    # Let's Encrypt 인증서 (certbot 자동 발급)
    ssl_certificate     /etc/letsencrypt/live/api.shinhanhousing.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shinhanhousing.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 보안 헤더 (helmet이 Node 레벨에도 세팅하지만 이중 방어)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 업로드 크기 제한 (presigned URL 업로드는 S3로 직접 감, 여기는 API body만)
    client_max_body_size 10M;

    # 로깅
    access_log /var/log/nginx/shinhan-api-access.log;
    error_log  /var/log/nginx/shinhan-api-error.log warn;

    location /health {
        proxy_pass http://shinhan_api/api/health;
        access_log off;
    }

    location /api/ {
        proxy_pass http://shinhan_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 기타 경로는 404 (정적 파일은 CloudFront/S3에서 서빙)
    location / { return 404; }
}
