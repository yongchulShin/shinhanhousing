# /etc/nginx/sites-available/shinhan-api
# 심볼릭 링크: sudo ln -s /etc/nginx/sites-available/shinhan-api /etc/nginx/sites-enabled/

upstream shinhan_api {
    server 127.0.0.1:3000;
    keepalive 32;
    keepalive_requests 1000;
}

# HTTP API origin. CloudFront forwards /api/* here over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    client_max_body_size 10M;
    access_log /var/log/nginx/shinhan-api-access.log;
    error_log  /var/log/nginx/shinhan-api-error.log warn;

    location /health {
        proxy_pass http://shinhan_api/api/health;
        access_log off;
    }

    location /api/ {
        proxy_pass http://shinhan_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location / { return 404; }
}
